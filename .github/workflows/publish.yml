name: Python distribution

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Pinned build configuration
        run: ./scripts/audit.sh --pins
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
      - name: Proof audit and mutation checks
        if: matrix.os == 'ubuntu-22.04'
        run: |
          ./scripts/audit.sh
          python tests/mutants.py
      - name: Build wheel from source distribution
        run: |
          python -m pip install build twine mypy 'hatchling>=1.27,<2'
          python -m mypy --follow-untyped-imports python/pathfence hatch_build.py
          python -m build
      - name: Repair Linux wheel and determine its manylinux compatibility
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel patchelf
          auditwheel repair dist/*.whl --wheel-dir wheelhouse
      - name: Repair macOS wheel
        if: runner.os == 'macOS'
        run: |
          python -m pip install delocate
          delocate-wheel --require-archs $(uname -m) -w wheelhouse dist/*.whl
      - name: Include one source distribution
        if: matrix.os == 'ubuntu-22.04'
        run: cp dist/*.tar.gz wheelhouse/
      - name: Check package metadata
        run: python -m twine check --strict wheelhouse/*
      - name: Test installed wheel without the Lean toolchain
        run: |
          python -m pip install --no-deps wheelhouse/*.whl
          mv "$(lean --print-prefix)" "$RUNNER_TEMP/hidden-lean"
          mv .lake "$RUNNER_TEMP/hidden-lake"
          export PATHFENCE_BIN="$(command -v pathfence)"
          python -m unittest discover -s tests -v
          python -m pathfence check --allow /w -- a/../b
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-${{ matrix.os }}
          path: wheelhouse/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pathfence
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - name: Check release tag matches the built package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import zipfile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 4, f'Expected four wheels, found {len(wheels)}'
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata_path, = (n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
                  metadata = email.message_from_bytes(archive.read(metadata_path))
                  assert os.environ['RELEASE_TAG'] == 'v' + metadata['Version']
          PY
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
