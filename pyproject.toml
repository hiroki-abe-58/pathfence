[build-system]
requires = ["hatchling>=1.27,<2", "packaging>=24"]
build-backend = "hatchling.build"

[project]
name = "pathfence"
dynamic = ["version"]
description = "Verified lexical path confinement for AI-agent file tools, built with Lean 4"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/hiroki-abe-58/pathfence"
Issues = "https://github.com/hiroki-abe-58/pathfence/issues"

[project.scripts]
pathfence = "pathfence:main"

[tool.hatch.version]
path = "lakefile.lean"
pattern = 'version := v!"(?P<version>[^\"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["python/pathfence"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/python", "/hatch_build.py", "/pyproject.toml", "/README.md", "/LICENSE",
  "/Main.lean", "/PathFence.lean", "/PathFence", "/lakefile.lean",
  "/lake-manifest.json", "/lean-toolchain", "/scripts", "/tests", "/examples",
]
